name: Discovery crawler

on:
  repository_dispatch:
    types: [crawl]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: discovery-crawler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
      - uses: actions/upload-artifact@v5
        with:
          node-version: 22
      - name: Crawl queued searches
        run: node --experimental-strip-types --no-warnings crawler/run.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Keep the JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-results-${{ github.run_id }}
          path: crawler/output/*.json
          if-no-files-found: ignore
          retention-days: 14
